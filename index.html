<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jugendriege Glattfelden</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="card">
      <h1>Jugendriege Glattfelden</h1>
      <p class="subtitle">Trainingsübersicht</p>
    </header>

    <!-- LOGIN -->
    <section class="card" id="login-card">
      <h2>Login</h2>

      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" id="username-input" />
      </div>

      <div class="form-group">
        <label>Passwort</label>
        <input type="password" id="password-input" />
      </div>

      <button id="login-btn">Einloggen</button>
      <p id="login-error" class="training-meta hidden"></p>
    </section>

    <!-- APP -->
    <div id="app-content" class="hidden">

      <!-- NÄCHSTES TRAINING -->
      <section class="card">
        <div class="section-header">
          <h2>Nächstes Training</h2>
          <button id="logout-btn" class="secondary small-btn">Logout</button>
        </div>

        <p id="current-role" class="training-meta"></p>

        <p id="next-training-date"></p>
        <p id="next-training-status" class="training-meta"></p>
        <p id="next-training-focus" class="training-meta"></p>
        <p id="next-training-leaders" class="training-meta"></p>

        <ul id="next-training-program"></ul>

        <div id="next-training-add-area">
          <input id="next-program-input" type="text" />
          <button id="add-next-program-btn">Hinzufügen</button>
        </div>
      </section>

      <!-- ADMIN -->
      <section class="card" id="admin-section">
        <h2>Training planen</h2>

        <input type="hidden" id="editing-training-id" />

        <input type="date" id="training-date" />
        <select id="training-status">
          <option>Findet statt</option>
          <option>Fällt aus</option>
        </select>

        <input type="text" id="training-focus" placeholder="Fokus" />

        <div class="leaders-select">
          <label><input type="checkbox" class="leader-checkbox" value="Damian"> Damian</label>
          <label><input type="checkbox" class="leader-checkbox" value="Selina"> Selina</label>
          <label><input type="checkbox" class="leader-checkbox" value="Svenja"> Svenja</label>
          <label><input type="checkbox" class="leader-checkbox" value="Noel"> Noel</label>
        </div>

        <input type="text" id="program-input" />
        <button id="add-program-btn">Hinzufügen</button>

        <ul id="program-preview-list"></ul>

        <button id="save-training-btn">Speichern</button>
        <button id="cancel-edit-btn" class="hidden">Abbrechen</button>
      </section>

      <!-- LETZTE -->
      <section class="card">
        <div class="section-header">
          <h2>Letzte 3 Trainings</h2>
          <button id="toggle-last-trainings-btn">Toggle</button>
        </div>

        <div id="last-trainings-wrapper">
          <ul id="last-trainings-list"></ul>
        </div>
      </section>

      <!-- ALLE TRAININGS + PDF -->
      <section class="card" id="all-trainings-section">

        <div class="button-row" style="margin-bottom: 10px;">
  <button type="button" id="toggle-pdf-btn" class="secondary small-btn">
    PDF Export
  </button>
</div>

<div id="pdf-wrapper" class="hidden">
  <div class="form-group">
    <label for="pdf-from-date">Von</label>
    <input type="date" id="pdf-from-date" />
  </div>

  <div class="form-group">
    <label for="pdf-to-date">Bis</label>
    <input type="date" id="pdf-to-date" />
  </div>

  <div class="button-row">
    <button type="button" id="generate-pdf-btn">PDF generieren</button>
  </div>

  <p id="pdf-error" class="training-meta hidden"></p>
</div>
        
        <div class="section-header">
          <h2>Alle Trainings</h2>
          <button id="toggle-all-trainings-btn">Anzeigen</button>
        </div>

        <!-- PDF BUTTON -->
        <div class="button-row">
          <button id="toggle-pdf-btn">PDF Export</button>
        </div>

        <!-- PDF BEREICH -->
        <div id="pdf-wrapper" class="hidden">
          <input type="date" id="pdf-from-date" />
          <input type="date" id="pdf-to-date" />
          <button id="generate-pdf-btn">Generieren</button>
          <p id="pdf-error" class="training-meta hidden"></p>
        </div>

        <div id="all-trainings-wrapper" class="hidden">
          <div id="all-trainings-list"></div>
        </div>
      </section>

    </div>
  </div>

  <!-- FIREBASE + APP -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIza...",
      authDomain: "jugendriege-app.firebaseapp.com",
      projectId: "jugendriege-app",
      storageBucket: "jugendriege-app.firebasestorage.app",
      messagingSenderId: "871508360233",
      appId: "1:871508360233:web:1d49c529b9009065aa7038"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;

    await import("./app.js");
  </script>
</body>
</html>
